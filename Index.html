<!-- DANH SÁCH LOẠI SÚNG VÀ BẮT TÂM -->
<div class="category-title">🎯 CẤU HÌNH TÂM SÚNG</div>

<!-- 1. SHOTGUN -->
<div class="config-card">
  <div class="card-header">
    <span class="icon">💥</span>
    <span class="title">SHOTGUN (M1887, M1014, Spas12)</span>
  </div>
  <div class="control-group">
    <label>Độ Nhạy Chế Độ Shotgun</label>
    <input type="range" min="0" max="100" value="100" class="slider" id="sg-sens">
  </div>
  <div class="toggle-group">
    <span>Aim Lock Head Shotgun</span>
    <input type="checkbox" id="sg-aim" class="toggle-switch">
  </div>
</div>

<!-- 2. TIỂU LIÊN (SMG) -->
<div class="config-card">
  <div class="card-header">
    <span class="icon">⚡</span>
    <span class="title">TIỂU LIÊN (MP40, UMP, Thompson)</span>
  </div>
  <div class="control-group">
    <label>Tốc Độ Ghìm Tâm SMG</label>
    <input type="range" min="0" max="100" value="95" class="slider" id="smg-sens">
  </div>
  <div class="toggle-group">
    <span>Tự Động Kéo Tâm SMG</span>
    <input type="checkbox" id="smg-aim" class="toggle-switch" checked>
  </div>
</div>

<!-- 3. SÚNG TRƯỜNG (AR) -->
<div class="config-card">
  <div class="card-header">
    <span class="icon">🔥</span>
    <span class="title">SÚNG TRƯỜNG (AK47, M4A1, GROZA)</span>
  </div>
  <div class="control-group">
    <label>Tốc Độ Đạn Súng Trường</label>
    <input type="range" min="0" max="100" value="90" class="slider" id="ar-sens">
  </div>
  <div class="toggle-group">
    <span>Gia Tốc Đạn Aimlock AR</span>
    <input type="checkbox" id="ar-aim" class="toggle-switch" checked>
  </div>
</div>

<!-- 4. SÚNG NGẮM (SNIPER) -->
<div class="config-card">
  <div class="card-header">
    <span class="icon">🎯</span>
    <span class="title">SÚNG NGẮM (AWM, M82B, Kar98k)</span>
  </div>
  <div class="control-group">
    <label>Khóa Bắt Tâm Súng Ngắm</label>
    <input type="range" min="0" max="100" value="100" class="slider" id="sniper-sens">
  </div>
  <div class="toggle-group">
    <span>Auto Switch & Quick Aim Sniper</span>
    <input type="checkbox" id="sniper-aim" class="toggle-switch" checked>
  </div>
</div>
